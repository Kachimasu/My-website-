<!DOCTYPE html>  
<html lang="en">    
<head>    
<meta charset="UTF-8">    
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Kachimasu</title>  
<style>    
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
min-height:100vh;
position:relative;
}

/* Animated Background */
body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(circle,#1f1f1f 0%,transparent 20%),
radial-gradient(circle,#111 0%,transparent 25%),
radial-gradient(circle,#222 0%,transparent 15%);
background-size:400px 400px;
animation:bgmove 25s linear infinite;
opacity:0.4;
z-index:-2;
}

@keyframes bgmove{
0%{
transform:translate(0,0);
}
100%{
transform:translate(-200px,-200px);
}
}

/* Floating Glow */
.glow{
position:fixed;
width:400px;
height:400px;
background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 70%);
filter:blur(50px);
z-index:-1;
animation:float 10s ease-in-out infinite alternate;
}

.glow1{
top:-100px;
left:-100px;
}

.glow2{
bottom:-100px;
right:-100px;
animation-delay:5s;
}

@keyframes float{
from{
transform:translateY(0px);
}
to{
transform:translateY(50px);
}
}

/* Header */
header{
padding:30px;
font-size:22px;
font-weight:bold;
letter-spacing:5px;
animation:fadeDown 1s ease;
}

@keyframes fadeDown{
from{
opacity:0;
transform:translateY(-30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Hero */
.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

/* Animated Title */
.hero h1{
font-size:80px;
font-weight:900;
margin-bottom:15px;
background:linear-gradient(90deg,#fff,#666,#fff);
background-size:200%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 5s linear infinite;
}

@keyframes shine{
0%{
background-position:0%;
}
100%{
background-position:200%;
}
}

.hero p{
color:#999;
font-size:18px;
margin-bottom:50px;
animation:fadeUp 1.2s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Social Links */
.social-links{
display:flex;
gap:25px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:70px;
}

.social-links a{
width:90px;
height:90px;
border-radius:25px;
display:flex;
justify-content:center;
align-items:center;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
transition:0.4s;
animation:fadeUp 1.5s ease;
}

.social-links a:hover{
transform:translateY(-15px) scale(1.1) rotate(5deg);
box-shadow:
0 0 20px rgba(255,255,255,0.2),
0 0 40px rgba(255,255,255,0.1);
background:rgba(255,255,255,0.1);
}

.social-links img{
width:50px;
height:50px;
}

/* YouTube Cards */
.youtube-section{
width:100%;
max-width:650px;
display:flex;
flex-direction:column;
gap:25px;
}

.channel{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.08);
transition:0.4s;
animation:fadeUp 2s ease;
position:relative;
overflow:hidden;
}

.channel::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.08),
transparent
);
transition:0.7s;
}

.channel:hover::before{
left:100%;
}

.channel:hover{
transform:scale(1.03);
box-shadow:
0 0 30px rgba(255,255,255,0.12);
}

.channel a{
text-decoration:none;
color:white;
font-size:24px;
font-weight:bold;
}

/* Footer */
footer{
padding:40px;
text-align:center;
color:#666;
font-size:15px;
animation:fadeUp 2.5s ease;
}

/* --- NEW CSS FOR DISCORD MODAL --- */
.discord-modal {
  display: none; /* Hidden by default */
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999;
  justify-content: center;
  align-items: center;
}

/* Show the modal when the URL target matches the ID */
.discord-modal:target {
  display: flex; 
}

.modal-bg-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover; /* Ensures the video covers the whole screen */
  z-index: -1;
  opacity: 0.5; /* Dims the video so buttons are visible */
}

.modal-content {
  background: rgba(0, 0, 0, 0.7);
  padding: 50px;
  border-radius: 20px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(15px);
  animation: fadeUp 0.5s ease;
}

.modal-content h2 {
  font-size: 32px;
  margin-bottom: 30px;
}

.modal-buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
}

.btn {
  text-decoration: none;
  padding: 15px 35px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 12px;
  transition: 0.3s;
}

.join-btn {
  background: #5865F2; /* Discord brand color */
  color: white;
}

.join-btn:hover {
  background: #4752C4;
  transform: scale(1.05);
}

.close-btn {
  background: transparent;
  color: white;
  border: 2px solid white;
}

.close-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: scale(1.05);
}

/* Mobile */
@media(max-width:600px){
.hero h1{font-size:48px;}
.social-links a{width:75px;height:75px;}
.social-links img{width:40px;height:40px;}
.channel a{font-size:18px;}
.modal-buttons { flex-direction: column; }
}

</style>  
</head>  
<body>  

<div class="glow glow1"></div>
<div class="glow glow2"></div>  

<header>KACHIMASU</header>  

<section class="hero">  
  <h1>KACHIMASU</h1>  
  <p>Gaming • Chaos • Creativity</p>  
  
  <div class="social-links">  
    <a href="https://www.instagram.com/wins_chauhan?igsh=ejBwbmpmd29zeTJm" target="_blank">    
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">    
    </a>  
    <a href="https://www.reddit.com/u/winschauhan/s/QXgqgGEHZI" target="_blank">    
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111589.png">    
    </a>  
    <!-- CHANGED: Link now points to #discord-modal instead of the external link -->
    <a href="#discord-modal">    
      <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png">    
    </a>  
  </div>  
  
  <div class="youtube-section">  
    <div class="channel">    
      <a href="https://youtube.com/@kachimasu?si=Vfe9XLlt3b2hiHZ6" target="_blank">    
      🎮 Kachimasu Main Channel    
      </a>    
    </div>  
    <div class="channel">    
      <a href="https://youtube.com/@kachimasurandom?si=5obpKoCIFOR5Ic6j" target="_blank">    
      🔥 Kachimasu Random    
      </a>    
    </div>  
    <div class="channel">    
      <a href="https://youtube.com/@kachimasu-c2m?si=2LzrdA__xaJrJ3ps" target="_blank">    
      ⚡ Kachimasu C2M    
      </a>    
    </div>  
  </div>  
</section>  

<footer>Built with GitHub Pages</footer>  

<!-- --- NEW HTML: THE DISCORD MODAL OVERLAY --- -->
<div id="discord-modal" class="discord-modal">
  
  <!-- BACKGROUND VIDEO: Replace the 'src' link with your actual video link -->
  <!-- Note: autoplay, loop, muted, and playsinline are required for HTML videos to play automatically in the background -->
  <video autoplay loop muted playsinline class="modal-bg-video">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
  </video>

  <div class="modal-content">
    <h2>Join the Community</h2>
    <div class="modal-buttons">
      <!-- The actual Discord invite link -->
      <a href="https://discord.com/invite/heartscafe" target="_blank" class="btn join-btn">JOIN SERVER</a>
      
      <!-- Link to '#' removes the target, which closes the modal -->
      <a href="#" class="btn close-btn">CLOSE TAB</a>
    </div>
  </div>
</div>

</body>    
</html>
