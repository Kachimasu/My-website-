<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Social Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">MY NAME</div>
  </header>

  <section class="hero">
    <h1>MY SOCIAL HUB</h1>
    <p>All my accounts in one place</p>
    <div class="social-links">
      <a href="https://instagram.com/YOUR_USERNAME" target="_blank">
        <img src="instagram.png" alt="Instagram">
      </a>
      <a href="https://twitter.com/YOUR_USERNAME" target="_blank">
        <img src="twitter.png" alt="Twitter">
      </a>
      <a href="https://reddit.com/user/YOUR_USERNAME" target="_blank">
        <img src="reddit.png" alt="Reddit">
      </a>
      <a href="https://discord.com/users/YOUR_DISCORD_ID" target="_blank">
        <img src="discord.png" alt="Discord">
      </a>
      <a href="https://youtube.com/channel/YOUTUBE1" target="_blank">
        <img src="youtube.png" alt="YouTube 1">
      </a>
      <a href="https://youtube.com/channel/YOUTUBE2" target="_blank">
        <img src="youtube.png" alt="YouTube 2">
      </a>
      <a href="https://youtube.com/channel/YOUTUBE3" target="_blank">
        <img src="youtube.png" alt="YouTube 3">
      </a>
    </div>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <div class="project-cards">
      <div class="card">
        <h3>Keet Cafe</h3>
        <p>Homemade baking, Tasty Drinks</p>
      </div>
    </div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>

  <footer>
    <p>Thanks for visiting!</p>
  </footer>

  <script src="script.js"></script>
</body>
        </html>
